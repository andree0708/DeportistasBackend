syntax = "proto3";

package runsense.prediction.v1;

import "google/protobuf/timestamp.proto";
import "common.proto";
import "activity.proto";


// Solicitud de predicciÃ³n de rendimiento
message PredictionRequest {
  string runner_id = 1;
  string correlation_id = 2;
  runsense.activity.v1.ActivityHistory history = 3;
  runsense.common.v1.RaceDistance target_distance = 4;
  optional double custom_distance_km = 5;
  RunnerProfile profile = 6;
  google.protobuf.Timestamp requested_at = 7;
}

// Perfil bÃ¡sico del corredor para contexto del modelo
message RunnerProfile {
  optional int32 age = 1;
  optional double weight_kg = 2;
  optional double height_cm = 3;
  int32 experience_years = 4;
  string primary_goal = 5;
}

// Factor explicativo de la predicciÃ³n
message ExplanatoryFactor {
  string feature_name = 1;
  double importance = 2;
  double value_used = 3;
  string description = 4;
}

// Intervalo de incertidumbre
message UncertaintyInterval {
  double lower_bound_seconds = 1;
  double upper_bound_seconds = 2;
  double confidence_level = 3;    // 0.0-1.0
}

// Respuesta de predicciÃ³n
message PredictionResponse {
  string runner_id = 1;
  string correlation_id = 2;
  bool success = 3;
  optional double predicted_time_seconds = 4;
  optional double predicted_pace_sec_per_km = 5;
  optional UncertaintyInterval uncertainty = 6;
  string model_version = 7;
  string model_name = 8;
  int32 training_samples_used = 9;
  repeated ExplanatoryFactor top_factors = 10;
  repeated string warnings = 11;
  repeated runsense.common.v1.ProcessingError errors = 12;
  google.protobuf.Timestamp generated_at = 13;
  bool is_extrapolation = 14;  // true si se extrapola fuera del historial observado
}

// Solicitud de estimaciÃ³n de capacidad observada
message CapacityRequest {
  string runner_id = 1;
  string correlation_id = 2;
  runsense.activity.v1.ActivityHistory history = 3;
  google.protobuf.Timestamp requested_at = 4;
}

// Respuesta de capacidad observada
message CapacityResponse {
  string runner_id = 1;
  string correlation_id = 2;
  bool success = 3;
  optional double best_pace_5k_sec_per_km = 4;
  optional double best_pace_10k_sec_per_km = 5;
  optional double best_pace_half_marathon_sec_per_km = 6;
  optional double aerobic_threshold_pace_sec_per_km = 7;
  optional double estimated_vo2max = 8;
  repeated ExplanatoryFactor factors = 9;
  repeated string warnings = 10;
  repeated runsense.common.v1.ProcessingError errors = 11;
  google.protobuf.Timestamp generated_at = 12;
  string model_version = 13;
}
